bot:
  abi_migration_branches:
  - 7.35.x
  - 7.34.x
build_platform:
  linux_aarch64: linux_64
  linux_ppc64le: linux_64
  linux_riscv64: linux_64
conda_build:
  pkg_format: '2'
conda_forge_output_validation: true
github:
  branch_name: main
  tooling_branch_name: main
provider:
  linux_aarch64: default
  osx_arm64: default
test: native_and_emulated
workflow_settings:
  free_disk_space:
  - os: linux
    value: quick
  pagefile_size:
  - os: linux
    value: 10
